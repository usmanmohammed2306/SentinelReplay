name: sentinel-replay

services:
  db:
    image: postgres:17.12-alpine@sha256:34261f594522cf41dfcb76aefd42b9d201098b0e6b23c9c68733f169e4218b6f
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_PASSWORD: ${SENTINEL_DB_PASSWORD:?set a URL-safe local database password}
      SENTINEL_APP_DB_PASSWORD: ${SENTINEL_APP_DB_PASSWORD:?set a URL-safe application database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb/10-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  migrate:
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: Dockerfile
    image: sentinel-replay-api:local
    command: ["alembic", "upgrade", "head"]
    environment:
      SENTINEL_DATABASE_URL: postgresql+psycopg://postgres:${SENTINEL_DB_PASSWORD}@db:5432/sentinel
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  init-evidence:
    image: sentinel-replay-api:local
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: Dockerfile
    user: "0:0"
    command: ["python", "-m", "sentinel_replay.provision_storage"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    volumes:
      - evidence_data:/var/lib/sentinel/evidence
      - evidence_keys:/run/sentinel-secrets
      - ${SENTINEL_EVIDENCE_KEY_HOST:?point to a private32-byte AES key}:/seed/storage.key:ro
      - ${SENTINEL_TRUST_REGISTRY_HOST:?point to the operator public-key registry}:/seed/trust.json:ro
      - trust_config:/run/sentinel-trust

  api:
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: Dockerfile
    image: sentinel-replay-api:local
    environment:
      SENTINEL_DATABASE_URL: postgresql+psycopg://sentinel_api:${SENTINEL_APP_DB_PASSWORD}@db:5432/sentinel
      SENTINEL_API_TOKEN: ${SENTINEL_API_TOKEN:?set a 32-character or longer local token}
      SENTINEL_ENCRYPTION_KEY: /run/sentinel-secrets/storage.key
      SENTINEL_TRUST_REGISTRY: /run/sentinel-trust/registry.json
      SENTINEL_MAX_INFLIGHT: "2"
      SENTINEL_ACCESS_GRANTS: ${SENTINEL_ACCESS_GRANTS:-[]}
    volumes:
      - evidence_data:/var/lib/sentinel/evidence
      - evidence_keys:/run/sentinel-secrets:ro
      - trust_config:/run/sentinel-trust:ro
      - ${SENTINEL_TRUSTED_PUBLIC_KEY_HOST:?point to a trusted public key file}:/run/sentinel/trusted.pub:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      init-evidence:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [internal, edge]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=256m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    pids_limit: 128

  ui:
    build:
      context: ../../ui
      dockerfile: Dockerfile
    image: sentinel-replay-ui:local
    environment:
      SENTINEL_API_URL: http://api:8000
      SENTINEL_UI_ORIGIN: http://127.0.0.1:3000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 64
    networks: [edge]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6

networks:
  internal:
    internal: true
  edge: {}

volumes:
  postgres_data:
  evidence_data:
  evidence_keys:
  trust_config:
