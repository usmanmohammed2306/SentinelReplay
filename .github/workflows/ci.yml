name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ui:
    name: Production UI image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the pinned Next.js production image
        run: docker build --tag sentinel-replay-ui:ci ui

  python:
    name: Python 3.12 checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the locked uv and Python toolchain
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          python-version: "3.12"
          enable-cache: true

      - name: Install the locked project
        run: uv sync --frozen

      - name: Run format, lint, type, and unit checks
        run: make check

      - name: Exercise the installed CLI
        run: uv run --frozen sentinel version

  postgres:
    name: PostgreSQL 17 signed-ingest integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.12-alpine@sha256:34261f594522cf41dfcb76aefd42b9d201098b0e6b23c9c68733f169e4218b6f
        env:
          POSTGRES_PASSWORD: sentinel-ci-only
          POSTGRES_DB: sentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sentinel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SENTINEL_DATABASE_URL: postgresql+psycopg://postgres:sentinel-ci-only@127.0.0.1:5432/sentinel
      SENTINEL_TEST_DATABASE_URL: postgresql+psycopg://postgres:sentinel-ci-only@127.0.0.1:5432/sentinel
      SENTINEL_TEST_DATABASE_DISPOSABLE: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the locked uv and Python toolchain
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          python-version: "3.12"
          enable-cache: true

      - name: Install the locked project
        run: uv sync --frozen

      - name: Apply database migration
        run: uv run --frozen alembic upgrade head

      - name: Test signed ingest against PostgreSQL
        run: make postgres-integration

  opa:
    name: Guarded Docker isolation and OPA 1.0
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the locked uv and Python toolchain
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          python-version: "3.12"
          enable-cache: true

      - name: Install the locked project
        run: uv sync --frozen

      - name: Test actual Docker isolation and compiled Rego decisions
        run: |
          uv run --frozen python - <<'PY'
          import subprocess
          from sentinel_replay.isolation import PYTHON_IMAGE
          from sentinel_replay.policy import OPA_DOCKER_IMAGE
          for image in (PYTHON_IMAGE, OPA_DOCKER_IMAGE):
              subprocess.run(["docker", "pull", image], check=True)
          PY
          make branch-contract

  browser:
    name: Production Chromium journeys and 3k/50k interaction budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the locked uv and Python toolchain
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          python-version: "3.12"
          enable-cache: true
      - name: Install the locked API and browser dependencies
        run: |
          uv sync --frozen
          node --version
          npm install --global pnpm@12.6.0
          cd ui
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Build the production application
        working-directory: ui
        run: pnpm build
      - name: Exercise evidence journeys and repeated timeline interactions
        working-directory: ui
        run: pnpm test:e2e

  clean-room:
    name: Clean-checkout encrypted deployment and crash recovery
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the locked uv and Python toolchain without a dependency cache
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          python-version: "3.12"
          enable-cache: false
      - name: Install locked dependencies and fetch the declared policy evaluator
        run: |
          uv sync --frozen
          uv run --frozen python - <<'PY'
          import subprocess
          from sentinel_replay.policy import OPA_DOCKER_IMAGE
          from scripts.validate_branch_api import POSTGRES_IMAGE
          for image in (OPA_DOCKER_IMAGE, POSTGRES_IMAGE):
              subprocess.run(["docker", "pull", image], check=True)
          PY
      - name: Build both production images from this checkout
        run: |
          docker build --platform linux/amd64 --tag sentinel-replay-api:validation-20261113 .
          docker build --tag sentinel-replay-ui:validation-20261113 ui
      - name: Generate and replay the full demo from empty state
        run: uv run --frozen sentinel demo --destination .local-controller/clean-room-demo
      - name: Exercise encrypted import, witness, SIGKILL, backup and fresh-volume restore
        run: |
          uv run --frozen python scripts/validate_deployment.py \
            --capsule .local-controller/clean-room-demo/investigation.sentinel \
            --output .local-controller/clean-room-recovery
          uv run --frozen python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path(".local-controller/clean-room-recovery/receipt.json").read_text())
          assert report["completed"] and all(report["cleanup"].values())
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
      - name: Retain sanitized recovery diagnostics on failure
        if: failure()
        run: |
          uv run --frozen python - <<'PY'
          from pathlib import Path
          root = Path(".local-controller/clean-room-recovery")
          env = root / "deployment.env"
          secrets = []
          if env.exists():
              for line in env.read_text().splitlines():
                  name, _, value = line.partition("=")
                  if any(part in name for part in ("PASSWORD", "TOKEN")) and value:
                      secrets.append(value)
          for name in ("receipt.json", "deployment.log"):
              path = root / name
              if path.exists():
                  text = path.read_text(errors="replace")
                  for value in secrets:
                      text = text.replace(value, "[REDACTED]")
                  print(name + "\n" + text[-24000:])
          PY
