name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ui:
    name: Production UI image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the pinned Next.js production image
        run: docker build --tag sentinel-replay-ui:ci ui

  python:
    name: Python 3.12 checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the locked uv and Python toolchain
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          python-version: "3.12"
          enable-cache: true

      - name: Install the locked project
        run: uv sync --frozen

      - name: Run format, lint, type, and unit checks
        run: make check

      - name: Exercise the installed CLI
        run: uv run --frozen sentinel version

  postgres:
    name: PostgreSQL 17 signed-ingest integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.12-alpine@sha256:34261f594522cf41dfcb76aefd42b9d201098b0e6b23c9c68733f169e4218b6f
        env:
          POSTGRES_PASSWORD: sentinel-ci-only
          POSTGRES_DB: sentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sentinel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SENTINEL_DATABASE_URL: postgresql+psycopg://postgres:sentinel-ci-only@127.0.0.1:5432/sentinel
      SENTINEL_TEST_DATABASE_URL: postgresql+psycopg://postgres:sentinel-ci-only@127.0.0.1:5432/sentinel
      SENTINEL_TEST_DATABASE_DISPOSABLE: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the locked uv and Python toolchain
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          python-version: "3.12"
          enable-cache: true

      - name: Install the locked project
        run: uv sync --frozen

      - name: Apply database migration
        run: uv run --frozen alembic upgrade head

      - name: Test signed ingest against PostgreSQL
        run: make postgres-integration

  opa:
    name: OPA 1.0 policy conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the locked uv and Python toolchain
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          python-version: "3.12"
          enable-cache: true

      - name: Install the locked project
        run: uv sync --frozen

      - name: Compare compiled Rego decisions with pinned OPA
        run: make opa-contract
