name: Optional AWS adapter checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract:
    name: Offline SDK and template checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the locked uv and Python toolchain
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          python-version: "3.12"
          enable-cache: true

      - name: Install optional AWS dependencies
        run: uv sync --frozen --extra aws --group aws-dev

      - name: Validate AWS requests without cloud credentials
        run: make aws-contract

      - name: Lint optional CloudFormation template
        run: make aws-infra
